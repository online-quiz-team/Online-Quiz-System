name: C++ CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install OpenSSL
      run: sudo apt-get update && sudo apt-get install -y libssl-dev
    - name: Compile and Run All Tests
      run: |
        g++ -std=c++17 -Isrc tests/registration_test.cpp src/registration.cpp -o test_reg -lssl -lcrypto && ./test_reg
        g++ -std=c++17 -Isrc tests/authentication_test.cpp src/authentication.cpp src/registration.cpp -o test_auth -lssl -lcrypto && ./test_auth
        g++ -std=c++17 -Isrc tests/quiz_scoring_test.cpp src/quiz_scoring.cpp -o test_score -lssl -lcrypto && ./test_score
